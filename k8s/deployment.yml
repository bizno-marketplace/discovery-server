apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: bizno
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-server }
  template:
    metadata:
      labels: { app: discovery-server }
    spec:
      containers:
        - name: discovery-server
          # Replace <TAG> with the git short SHA generated by build-and-push.sh
          image: gervasioartur/discovery-server:b866c61
          env:
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: ZIPKIN_URL
              value: "http://zipkin:9411"
          ports:
            - containerPort: 8761
            - containerPort: 9761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9761
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9761
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: bizno
spec:
  selector: { app: discovery-server }
  ports:
    - port: 8761
      targetPort: 8761
      name: main
    - port: 9761
      targetPort: 9761
      name: management